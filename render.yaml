# Configuración para publicar el portal en Render (render.com)
# Las claves (MONGODB_URI, ADMIN_KEY) se escriben en la página de Render, NO aquí.
services:
  - type: web
    name: ecci-ia
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "0"
      - key: DETRAS_DE_PROXY
        value: "1"
      - key: DB_NAME
        value: ecci_ia
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
